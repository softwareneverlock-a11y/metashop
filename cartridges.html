<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METASHOP | Картриджи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">METASHOP</a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="liquids.html">Жидкости</a></li>
                <li><a href="cartridges.html" class="active">Картриджи</a></li>
            </ul>
            <div class="cart-icon" onclick="toggleCart()">
                🛒 <span id="cart-count">0</span>
            </div>
        </nav>
    </header>

    <main>
        <section class="category-header">
            <h1>Наличие <span class="accent">Картриджей</span></h1>
        </section>

        <div id="cartridge-grid" class="product-grid">
            </div>
    </main>

    <div id="cart-modal" class="cart-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
        <div class="cart-content" style="background:#111; border:1px solid #333; padding:30px; border-radius:20px; width:90%; max-width:400px; position:relative;">
            <span class="close-cart" onclick="toggleCart()" style="position:absolute; top:15px; right:20px; cursor:pointer; font-size:20px;">✕</span>
            <h3 style="margin-bottom:20px; text-align:center;">Ваша корзина</h3>
            <div id="cart-items" style="max-height:300px; overflow-y:auto; margin-bottom:20px;"></div>
            <button class="buy-now-btn" onclick="checkout()" style="width:100%;">Оформить в Telegram</button>
        </div>
    </div>

    <footer class="shop-footer">
        <div class="footer-line"></div>
        <p>Заказ: <a href="https://t.me/MetaShop4">@MetaShop4</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
