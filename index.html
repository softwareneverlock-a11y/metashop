<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MetaShop - Lucky 15ml</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
    }
    header {
      display: flex;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #222;
    }
    .title {
      font-size: 1.4em;
      font-weight: bold;
      color: #00aaff;
    }
    .subtitle {
      font-size: 0.9em;
      color: #888;
      margin-left: 10px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .product-card {
      background-color: #111;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .product-image {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .product-name {
      font-weight: bold;
      margin: 5px 0;
    }
    .product-desc {
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 5px;
    }
    .product-price {
      color: #00aaff;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .buy-btn {
      background-color: #00aaff;
      border: none;
      border-radius: 20px;
      padding: 8px 15px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .buy-btn:hover {
      background-color: #0088cc;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">MetaShop</div>
    <div class="subtitle">Lucky 15ml — Витрина</div>
  </header>

  <main>
    <div class="product-grid" id="productGrid"></div>
  </main>

 <script>
const products = [
  { name: "Lucky 15ml", desc: "Watermelon Lemonade", price: "140", img: "images/watermelon-lemonade.jpg" },
  { name: "Lucky 15ml", desc: "Blueberry", price: "140", img: "images/blueberry.jpg" },
  { name: "Lucky 15ml", desc: "Cold Mango", price: "140", img: "images/cold-mango.jpg" },
  { name: "Lucky 15ml", desc: "Spearmint", price: "140", img: "images/spearmint.jpg" },
  { name: "Lucky 15ml", desc: "Cola", price: "140", img: "images/cola.jpg" },
  { name: "Lucky 15ml", desc: "Banana", price: "140", img: "images/banana.jpg" },
  { name: "Lucky 15ml", desc: "Pink Lemonade", price: "140", img: "images/pink-lemonade.jpg" },
  { name: "Lucky 15ml", desc: "Apple", price: "140", img: "images/apple.jpg" },
  { name: "Lucky 15ml", desc: "Grape", price: "140", img: "images/grape.jpg" },
  { name: "Lucky 15ml", desc: "Strawberry", price: "140", img: "images/strawberry.jpg" }
];

const grid = document.getElementById("productGrid");

products.forEach(p => {
  const card = document.createElement("div");
  card.className = "product-card";
  card.innerHTML = `
    <img src="${p.img}" alt="${p.desc}">
    <h3>${p.name}</h3>
    <p>${p.desc}</p>
    <p class="product-price">${p.price} грн</p>
    <button class="buy-btn">Купить</button>
  `;
  grid.appendChild(card);
});
</script>
