<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MetaShop - Lucky 15ml</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
    }
    header {
      display: flex;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #222;
    }
    .title {
      font-size: 1.4em;
      font-weight: bold;
      color: #00aaff;
    }
    .subtitle {
      font-size: 0.9em;
      color: #888;
      margin-left: 10px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .product-card {
      background-color: #111;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .product-image {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .product-name {
      font-weight: bold;
      margin: 5px 0;
    }
    .product-desc {
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 5px;
    }
    .product-price {
      color: #00aaff;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .buy-btn {
      background-color: #00aaff;
      border: none;
      border-radius: 20px;
      padding: 8px 15px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .buy-btn:hover {
      background-color: #0088cc;
    }
  </style>
</head>
